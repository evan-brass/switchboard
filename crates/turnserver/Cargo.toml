[package]
name = "turnserver"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.14"
ipnet = "2.12.2"
mio = { version = "1.2.4", features = ["os-ext", "os-poll"] }
nix = { version = "0.31.3", features = ["socket", "uio"] }
socket2 = "0.6.5"
stun = { path = "../stun" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tun-rs = "2.8.16"
