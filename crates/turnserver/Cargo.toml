[package]
name = "turnserver"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.14"
hmac = "0.13.0"
ipnet = "2.12.2"
md5 = "0.8.1"
mio = { version = "1.2.4", features = ["os-ext", "os-poll"] }
nix = { version = "0.31.3", features = ["socket", "uio"] }
sha1 = "0.11.0"
socket2 = "0.6.5"
stun = { path = "../stun" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tun-rs = "2.8.16"
